name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install latest Minesweep
        run: |
          set -euo pipefail

          release="$(curl -fsSL https://api.github.com/repos/hxmbl/minesweep/releases/latest)"
          tag="$(jq -er '.tag_name' <<< "$release")"
          asset="$(jq -er 'first(.assets[] | select(.name | test("_Linux_x86_64\\.tar\\.gz$"))) | .name' <<< "$release")"

          base="https://github.com/hxmbl/minesweep/releases/download/$tag"

          curl -fsSL "$base/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$base/checksums.txt" -o "$RUNNER_TEMP/checksums.txt"

          cd "$RUNNER_TEMP"
          awk -v asset="$asset" '$NF == asset { print; found=1 } END { if (!found) exit 1 }' \
            checksums.txt | sha256sum -c -

          tar -xzf "$asset"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 minesweep "$RUNNER_TEMP/bin/minesweep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan
        id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e

          if [ "$EVENT_NAME" = "pull_request" ]; then
            minesweep --diff --diff-base "$BASE_REF" \
              --config .minesweep.yml --fail-on high \
              --sarif --no-pager . > "$RUNNER_TEMP/results.sarif"
          else
            minesweep --config .minesweep.yml --fail-on high \
              --sarif --no-pager . > "$RUNNER_TEMP/results.sarif"
          fi

          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Enforce scan result
        run: |
          code="${{ steps.scan.outputs.exit_code }}"

          case "$code" in
            0) echo "No high-confidence findings." ;;
            1) echo "::error::Secrets detected."; exit 1 ;;
            2) echo "::error::Scan incomplete."; exit 2 ;;
            *) echo "::error::Unexpected Minesweep exit code: $code"; exit 1 ;;
          esac

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/results.sarif
        continue-on-error: true

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test-clippy:
    name: Test + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GPUI system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  linux-build:
    name: Linux Build
    needs: test-clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GPUI system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  macos-build:
    name: macOS Build
    needs: test-clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
