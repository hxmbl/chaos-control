name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan
        id: scan
        continue-on-error: true
        uses: hxmbl/minesweep@v2.6.0
        with:
          sarif: minesweep-results.sarif
          args: ${{ github.event_name == 'pull_request' && format('--diff --diff-base {0} --config .minesweep.yml --fail-on high .', github.base_ref) || '--config .minesweep.yml --fail-on high .' }}

      - name: Enforce scan result
        if: always()
        run: |
          outcome="${{ steps.scan.outcome }}"
          case "$outcome" in
            success) echo "No high-confidence findings." ;;
            failure) echo "::error::Minesweep reported findings or the scan did not complete."; exit 1 ;;
            *) echo "::error::Unexpected Minesweep step outcome: $outcome"; exit 1 ;;
          esac

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: minesweep-results.sarif
        continue-on-error: true

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test-clippy:
    name: Test + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GPUI system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  linux-build:
    name: Linux Build
    needs: test-clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GPUI system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  macos-build:
    name: macOS Build
    needs: test-clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
