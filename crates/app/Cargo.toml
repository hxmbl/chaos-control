[package]
name = "chaos-control"
description = "A group chat for AI and humans."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "chaos-control"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
model.workspace = true
ui.workspace = true
chaos-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread"] }

[lints]
workspace = true
