[package]
name = "chaos-core"
description = "Chaos Control's agent runtime: store, delivery, policy, adapters, chat MCP. No UI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol = { version = "3.5.0", features = ["process", "stdio", "unstable_protocol_v2"] }
rmcp = { version = "3.7.0", features = ["server", "transport-streamable-http-server", "macros"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
axum = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
futures = "0.3"

[lints]
workspace = true
