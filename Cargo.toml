[workspace]
resolver = "2"
members = ["crates/app", "crates/model", "crates/ui"]
default-members = ["crates/app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.88"

[workspace.dependencies]
# GPUI, Zed's UI framework. Pinned to the latest crates.io release so CI and
# local builds resolve the same thing; bump deliberately.
gpui = "=0.2.2"
unicode-segmentation = "1.12"
model = { path = "crates/model" }
ui = { path = "crates/ui" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
