[workspace]
resolver = "2"
members = ["crates/app", "crates/model", "crates/ui"]
default-members = ["crates/app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.88"

[workspace.dependencies]
# GPUI, Zed's UI framework, from gpui-unofficial: automated crates.io builds of
# Zed's own gpui crates, versioned after the Zed release they come from. The
# library target is still `gpui`; apps start through the platform facade,
# aliased as `gpui_platform` as upstream does. Pinned exactly; bump deliberately.
gpui = { package = "gpui-unofficial", version = "=1.25.3" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.25.3" }
unicode-segmentation = "1.12"
model = { path = "crates/model" }
ui = { path = "crates/ui" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
